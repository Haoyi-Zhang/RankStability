name: Owned scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run current finite authored-input campaign
        run: timeout --signal=TERM --kill-after=10s 300s python -B tests/local_campaign.py --out scientific-results
      - name: Recompile owned C schemas and compare retained scientific content
        run: timeout --signal=TERM --kill-after=10s 600s python -B src/limited.py tests/reproduce.py --output scientific-results/clean-reproduction.json
      - name: Upload actual finite and reconstruction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owned-scientific-evidence
          path: scientific-results/
          if-no-files-found: warn
          retention-days: 14
